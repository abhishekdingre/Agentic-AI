services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: banner
      POSTGRES_PASSWORD: banner
      POSTGRES_DB: banner_copilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banner -d banner_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [banner-net]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [banner-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-banner_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-banner_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9001:9001"
    networks: [banner-net]

  mock-fhir:
    build: ./mock_fhir_server
    environment:
      ENV: ${ENV:-local}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [banner-net]

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://banner:banner@postgres:5432/banner_copilot
      REDIS_URL: redis://redis:6379/0
      FHIR_BASE_URL: http://mock-fhir:8000
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mock-fhir: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports:
      - "8000:8000"
    networks: [banner-net]

  worker:
    build: ./api
    command: ["arq", "banner_copilot.archival.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://banner:banner@postgres:5432/banner_copilot
      REDIS_URL: redis://redis:6379/0
      FHIR_BASE_URL: http://mock-fhir:8000
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [banner-net]

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    networks: [banner-net]

volumes:
  postgres_data:
  minio_data:

networks:
  banner-net:
