[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# timezone for the "Create Date" comment in generated migration files
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
revision_environment = false

# version path separator; As mentioned above, this is the character used to split
# version_locations. Valid values are:
# version_path_separator = :
# version_path_separator = ;
# version_path_separator = space
version_path_separator = os

# Placeholder only — the real DSN is postgresql+asyncpg://... and comes from
# Settings().database_url (env vars / .env), NOT this file. migrations/env.py
# overrides this value at runtime via config.set_main_option(). Kept here
# only because Alembic's Config object expects the key to exist.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# no post-write hooks configured for this project

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
