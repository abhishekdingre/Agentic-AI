[project]
name = "banner-copilot"
version = "0.1.0"
description = "Banner Health Physician Copilot — reference implementation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.27",
    "arq>=0.26",
    # >=1.8 required for output_config/adaptive-thinking structured-output shape
    # used in llm/claude_drafting.py (see claude-api skill docs) — anything on
    # the 0.x line predates that request shape entirely.
    "anthropic>=1.8,<2",
    "openai>=1.60",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.x's bcrypt backend self-test (`detect_wrap_bug`) crashes at
    # import time against bcrypt>=4.1 ("password cannot be longer than 72
    # bytes"), a well-known passlib/bcrypt incompatibility. Pin bcrypt to the
    # last known-good major line so `passlib.hash.bcrypt` actually works.
    "bcrypt>=4.0,<4.1",
    "structlog>=24.4",
    "tenacity>=9.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "aioboto3>=13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # Test-only: in-memory async SQLite engine for unit tests that need a
    # real (but non-Postgres) DB, so we don't require a live Postgres for
    # `pytest tests/unit` (see tests/unit/test_rbac.py).
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banner_copilot"]
