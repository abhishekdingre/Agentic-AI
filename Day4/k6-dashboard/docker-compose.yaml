services:

  # ──────────────────────────────────────────────────────────────────────────
  # InfluxDB 1.8 — k6's native time-series output target.
  # k6 writes to it via: --out influxdb=http://localhost:8086/k6
  # ──────────────────────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    environment:
      INFLUXDB_DB:                k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - k6-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Grafana — dashboards, auto-provisioned with InfluxDB + k6 dashboard.
  # Login: http://localhost:3000  (anonymous admin, no password needed)
  # ──────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/k6-dashboard.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - k6-net
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

networks:
  k6-net:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:
